name: Daily puzzles & deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *' # every six hours; generation is a no-op when up to date
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache strategy table
        uses: actions/cache@v4
        with:
          path: .cache
          key: strategy-${{ hashFiles('js/rules.js', 'js/strategy.js') }}

      - name: Test
        run: node --test

      - name: Generate upcoming puzzles
        run: node scripts/generate.mjs

      - name: Commit new puzzles
        run: |
          if [ -n "$(git status --porcelain puzzles)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add puzzles
            git commit -m "Add puzzles $(ls puzzles | tail -n 1 | cut -d. -f1)"
            git push
          fi

      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html favicon.svg .nojekyll css js puzzles _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
